<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real-site patterns</title>
<style>
  /* Astro/Next-style metric fallback: local() only, "fails" when the system font is absent */
  @font-face { font-family: "Brand fallback"; src: local("No Such Font XYZ"); size-adjust: 104%; }
  /* A real web font whose file is missing: must still be reported */
  @font-face { font-family: "Brand"; src: url("missing-brand-font.woff2") format("woff2"); }
  body { margin: 0; font-family: "Brand", "Brand fallback", system-ui, sans-serif; color: #111; background: #fff; }
  main { padding: 24px; }
  /* tight display leading: the font's content area is taller than the line box (not a spill) */
  .disp { font-size: 96px; line-height: .62; margin: 40px 0; }
  /* genuine spill: fixed box, too much text */
  .boxed { width: 120px; height: 20px; font-size: 14px; line-height: 20px; }
  /* caption reel: off-window lines are inert */
  .win { display: inline-block; height: 28px; overflow: hidden; vertical-align: top; }
  .reel { display: flex; flex-direction: column; }
  .reel > span { display: block; height: 28px; line-height: 28px; white-space: nowrap; }
  /* custom scrollbar whose focus style only touches a child */
  .bar { position: fixed; top: 0; right: 0; bottom: 0; width: 18px; }
  .bar:focus-visible { outline: none; }
  .bar .track { position: absolute; top: 0; right: 0; bottom: 0; width: 5px; background: #888; transform-origin: right; }
  .bar:focus-visible .track { transform: scaleX(1.4); }
  .muted { color: #9a9a9a; font-size: 12px; }
</style></head>
<body>
<main id="m">
  <h1 class="disp">BIG TITLE</h1>
  <div class="boxed" id="boxed">This sentence is far too long for a twenty pixel tall fixed box and wraps over several lines</div>
  <p>Find me on <span class="win"><span class="reel"><span><a href="#gh">GitHub</a></span><span inert><a href="#ig">Instagram profile link</a></span></span></span></p>
  <div style="width:300px"><h2 style="font-size:48px;line-height:.8;margin:0"><a href="#proj">Project title</a></h2><a href="#proj" style="display:inline-block;margin-top:-6px;padding:4px 0">Open project</a></div>
  <p class="muted c1">Caption one in the muted token</p>
  <p class="muted c2">Caption two in the muted token</p>
</main>
<div class="bar" role="scrollbar" aria-label="Fake page bar" aria-controls="m" aria-valuenow="0" tabindex="0"><span class="track"></span></div>
</body></html>
