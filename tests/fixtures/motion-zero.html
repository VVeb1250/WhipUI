<!doctype html><html lang="en"><meta charset="utf-8"><title>zero</title>
<style>.t{opacity:0}.t.on{animation:pop 240ms ease-out forwards}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.t.on{animation-duration:0s}}</style>
<button id="b">Show</button><div class="t" id="t" role="status">Saved</div>
<script>b.onclick=()=>t.classList.add('on')</script></html>
