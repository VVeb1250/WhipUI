<!doctype html><html lang="en"><meta charset="utf-8"><title>motion good</title>
<style>
body{font:16px system-ui;margin:24px}
.toast{position:fixed;right:24px;bottom:24px;padding:12px 16px;background:#222;color:#fff;border-radius:8px;opacity:0;transform:translateY(8px);pointer-events:none}
.toast.show{opacity:1;transform:none;transition:opacity 180ms cubic-bezier(0.2,0,0,1),transform 180ms cubic-bezier(0.2,0,0,1)}
@media (prefers-reduced-motion: reduce){ .toast.show{transform:none;transition:opacity 120ms linear} .toast{transform:none} }
</style>
<button id="save">Save</button>
<div class="toast" id="t" role="status">Saved</div>
<script>document.getElementById('save').onclick=()=>document.getElementById('t').classList.add('show')</script>
</html>
