name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run project setup smoke test
        run: node test/setup-smoke.mjs

      - name: Check syntax
        run: npm run syntax-check

      - name: Verify package contents
        run: npm pack --dry-run

  windows-setup:
    name: Windows setup Node ${{ matrix.node-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests including Windows npx launcher regression
        run: npm test

      - name: Run project setup smoke test
        run: node test/setup-smoke.mjs

      - name: Check syntax
        run: npm run syntax-check

  macos-setup:
    name: macOS (iOS host) setup Node ${{ matrix.node-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests including package-runner regression
        run: npm test

      - name: Run project setup smoke test
        run: node test/setup-smoke.mjs

      - name: Check syntax
        run: npm run syntax-check

      - name: Verify Apple runner
        run: xcodebuild -version
