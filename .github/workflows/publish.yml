name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version
        run: node -e "if ('v'+require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm test
      - run: npm run test:skills
      - run: npm run validate
      - run: npm pack --dry-run
      - name: Select npm dist-tag
        id: release
        run: node -e "const fs=require('node:fs'); const tag=require('./package.json').version.includes('-')?'next':'latest'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag='+tag+'\n')"
      - run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
